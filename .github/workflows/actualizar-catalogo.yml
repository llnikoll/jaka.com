name: Actualizar catalogo y publicar

# Corre en la nube de GitHub: no depende de que la PC este encendida.
# 09:00 UTC = 06:00 de Paraguay (UTC-3)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-catalogo.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lxml
        run: python -m pip install --quiet lxml

      - name: Leer el catalogo de ciclovia.com.py
        run: python poc/scraper_ciclovia.py --modo todo --incluir-raices --force

      - name: Regenerar el catalogo de la tienda
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tienda/build_catalogo.py 2>&1 | tee build.log

      - name: Guardar diagnostico si falla
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p debug
          cp build.log debug/build.log || true
          cp poc/data/categorias.csv debug/ || true
          head -c 3000 poc/data/productos.jsonl > debug/productos_head.txt || true
          ls -la poc/data > debug/listado.txt || true
          python --version > debug/python.txt 2>&1 || true
          env | sort > debug/entorno.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug
          git commit -m "debug: error al generar catalogo"
          git push

      - name: Fallar si el catalogo no se genero
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Guardar cambios de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tienda/data
          if git diff --cached --quiet; then
            echo "Sin cambios de precios: el catalogo quedo igual."
          else
            git commit -m "Catalogo actualizado $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Cambios publicados en el repositorio."
          fi

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta tienda
        uses: actions/upload-pages-artifact@v3
        with:
          path: tienda

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
