name: Actualizar catalogo y publicar

# Corre en la nube de GitHub: no depende de que la PC este encendida.
# 09:00 UTC = 06:00 de Paraguay (UTC-3)
#
# IMPORTANTE: el deploy esta separado en dos jobs (actualizar -> publicar).
# Antes se empaquetaba y publicaba en el mismo job y fallaba 1 de cada 3 veces:
# actions/deploy-pages consultaba el artefacto recien subido y la API todavia
# devolvia "Found 0 artifact(s)" (demora de indexacion). El job "publicar"
# espera a que el artefacto aparezca antes de publicar.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-catalogo.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lxml
        run: python -m pip install --quiet lxml

      - name: Leer el catalogo de ciclovia.com.py
        run: python poc/scraper_ciclovia.py --modo todo --incluir-raices --force

      - name: Regenerar el catalogo de la tienda
        run: python tienda/build_catalogo.py

      - name: Generar feed de productos para Meta
        run: python publicidad/generar_feed.py

      - name: Guardar cambios de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tienda/data tienda/publicidad
          if git diff --cached --quiet; then
            echo "Sin cambios de precios: el catalogo quedo igual."
          else
            git commit -m "Catalogo actualizado $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Cambios publicados en el repositorio."
          fi

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta tienda
        uses: actions/upload-pages-artifact@v3
        with:
          path: tienda

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    # Solo los deploys se serializan; el scraping puede correr en paralelo.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Esperar a que el artefacto este disponible
        shell: bash
        run: |
          for i in $(seq 1 40); do
            cantidad=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              | jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${cantidad:-0}" -ge 1 ]; then
              echo "Artefacto github-pages disponible."
              exit 0
            fi
            echo "Artefacto todavia no indexado (intento $i/40); esperando..."
            sleep 3
          done
          echo "ERROR: el artefacto github-pages no aparecio." >&2
          exit 1

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
