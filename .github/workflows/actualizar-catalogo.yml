name: Actualizar catalogo y publicar

# Corre en la nube de GitHub: no depende de que la PC este encendida.
# 09:00 UTC = 06:00 de Paraguay (UTC-3)

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar-catalogo.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lxml
        run: python -m pip install --quiet lxml

      - name: Leer el catalogo de ciclovia.com.py
        run: python poc/scraper_ciclovia.py --modo todo --incluir-raices --force

      - name: Regenerar el catalogo de la tienda
        run: python tienda/build_catalogo.py

      - name: Guardar cambios de precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tienda/data
          if git diff --cached --quiet; then
            echo "Sin cambios de precios: el catalogo quedo igual."
          else
            git commit -m "Catalogo actualizado $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "Cambios publicados en el repositorio."
          fi

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta tienda
        uses: actions/upload-pages-artifact@v3
        with:
          path: tienda

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
