name: Publicar tienda en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar la carpeta tienda
        uses: actions/upload-pages-artifact@v3
        with:
          path: tienda

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
